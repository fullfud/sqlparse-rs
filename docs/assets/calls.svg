<svg xmlns="http://www.w3.org/2000/svg" width="860" height="478" viewBox="0 0 860 478" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<rect width="860" height="478" rx="14" fill="#0d0e12"/>
<text x="28" y="38" fill="#ecedf0" font-size="20" font-weight="700">Every way into sqlparse</text>
<text x="28" y="60" fill="#9699a2" font-size="14">with install(), CPython 3.13, best of 3, every result equal to sqlparse's</text>
<text x="28" y="100" fill="#ecedf0" font-size="14" font-family="Cascadia Mono, Consolas, Menlo, monospace">format(sql.encode(), keyword_case='upper')</text>
<text x="832" y="100" fill="#9699a2" font-size="13" text-anchor="end">1.08 s → 0.012 s</text>
<rect x="28" y="110" width="470.0" height="14" rx="7" fill="#22242c"/>
<rect x="28" y="110" width="470.0" height="14" rx="7" fill="#ff8a3d"/>
<text x="512" y="122" fill="#ff8a3d" font-size="14" font-weight="700">87x faster</text>
<text x="612" y="122" fill="#5f626c" font-size="12">bytes in, 400 files</text>
<text x="28" y="160" fill="#ecedf0" font-size="14" font-family="Cascadia Mono, Consolas, Menlo, monospace">django-debug-toolbar's SQL panel</text>
<text x="832" y="160" fill="#9699a2" font-size="13" text-anchor="end">4.89 s → 0.079 s</text>
<rect x="28" y="170" width="470.0" height="14" rx="7" fill="#22242c"/>
<rect x="28" y="170" width="334.9" height="14" rx="7" fill="#ff8a3d"/>
<text x="512" y="182" fill="#ff8a3d" font-size="14" font-weight="700">62x faster</text>
<text x="612" y="182" fill="#5f626c" font-size="12">its own filter stacks, 400 queries</text>
<text x="28" y="220" fill="#ecedf0" font-size="14" font-family="Cascadia Mono, Consolas, Menlo, monospace">format(sql, reindent=True)</text>
<text x="832" y="220" fill="#9699a2" font-size="13" text-anchor="end">233 µs → 4 µs</text>
<rect x="28" y="230" width="470.0" height="14" rx="7" fill="#22242c"/>
<rect x="28" y="230" width="313.3" height="14" rx="7" fill="#ff8a3d"/>
<text x="512" y="242" fill="#ff8a3d" font-size="14" font-weight="700">58x faster</text>
<text x="612" y="242" fill="#5f626c" font-size="12">one short ORM query</text>
<text x="28" y="280" fill="#ecedf0" font-size="14" font-family="Cascadia Mono, Consolas, Menlo, monospace">split(sql)</text>
<text x="832" y="280" fill="#9699a2" font-size="13" text-anchor="end">55 µs → 1.3 µs</text>
<rect x="28" y="290" width="470.0" height="14" rx="7" fill="#22242c"/>
<rect x="28" y="290" width="226.9" height="14" rx="7" fill="#ff8a3d"/>
<text x="512" y="302" fill="#ff8a3d" font-size="14" font-weight="700">42x faster</text>
<text x="612" y="302" fill="#5f626c" font-size="12">one short ORM query</text>
<text x="28" y="340" fill="#ecedf0" font-size="14" font-family="Cascadia Mono, Consolas, Menlo, monospace">FilterStack.run, own stack with a ReindentFilter</text>
<text x="832" y="340" fill="#9699a2" font-size="13" text-anchor="end">3.69 s → 0.24 s</text>
<rect x="28" y="350" width="470.0" height="14" rx="7" fill="#22242c"/>
<rect x="28" y="350" width="83.7" height="14" rx="7" fill="#ff8a3d"/>
<text x="512" y="362" fill="#ff8a3d" font-size="14" font-weight="700">15.5x faster</text>
<text x="612" y="362" fill="#5f626c" font-size="12">400 files</text>
<text x="28" y="400" fill="#ecedf0" font-size="14" font-family="Cascadia Mono, Consolas, Menlo, monospace">sqlparse.parsestream(io.StringIO(sql))</text>
<text x="832" y="400" fill="#9699a2" font-size="13" text-anchor="end">3.34 s → 0.39 s</text>
<rect x="28" y="410" width="470.0" height="14" rx="7" fill="#22242c"/>
<rect x="28" y="410" width="46.5" height="14" rx="7" fill="#ff8a3d"/>
<text x="512" y="422" fill="#ff8a3d" font-size="14" font-weight="700">8.6x faster</text>
<text x="612" y="422" fill="#5f626c" font-size="12">400 files</text>
<text x="28" y="462" fill="#5f626c" font-size="12">How each was measured: docs/benchmarks.md</text>
</svg>

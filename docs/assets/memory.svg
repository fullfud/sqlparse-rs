<text x="28" y="138" fill="#ecedf0" font-size="14">sqlparse-turbo 0.1.4</text>
<rect x="220" y="126" width="500.0" height="16" rx="8" fill="#22242c"/>
<rect x="220" y="126" width="500.0" height="16" rx="8" fill="#e0625a"/>

[package]
name = "sqlparse-front"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `front/sqlparse_front.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fancy-regex = "0.20.2"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
mimalloc = { version = "0.1", default-features = false }
regex = "1.13.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

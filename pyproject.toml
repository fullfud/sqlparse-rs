[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sqlparse-turbo"
version = "0.1.4"
description = "sqlparse 0.6.1's format(), split() and parse() rewritten in Rust: same output, byte for byte, many times faster"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
# Runs in Rust with sqlparse 0.6.1; with any other version every call is sqlparse's own (see the README)
dependencies = ["sqlparse>=0.4"]
keywords = ["sql", "sqlparse", "formatter", "parser", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/fullfud/sqlparse-turbo"
Issues = "https://github.com/fullfud/sqlparse-turbo/issues"

[project.scripts]
sqlformat-turbo = "sqlparse_turbo.__main__:main"

[tool.maturin]
manifest-path = "rust/sqlparse-front/Cargo.toml"
python-source = "python"
module-name = "sqlparse_turbo._native"
include = [{ path = "LICENSE", format = "sdist" }]
# debug symbols a local Windows build leaves next to the module
exclude = ["python/sqlparse_turbo/*.pdb"]

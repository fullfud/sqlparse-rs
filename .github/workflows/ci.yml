# Builds the wheels on every platform the package ships for and runs the checks against sqlparse 0.6.1 on each
# OS x Python 3.10-3.14, from the wheel a user would install (not from the source tree).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # a release: everything below, then the upload to PyPI
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/sqlparse-front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sqlparse-front
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  wheels:
    name: Wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2014" }
          # zig (clang) outside the container: the manylinux2014 aarch64 cross gcc is too old for mimalloc's flags
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: "2014", zig: true }
          - { name: windows-x64, runner: windows-latest, target: x64, manylinux: "" }
          - { name: macos-universal2, runner: macos-latest, target: universal2-apple-darwin, manylinux: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.zig && 'off' || '' }}
          rust-toolchain: stable
          args: --release --out dist ${{ matrix.zig && '--zig' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: The sdist builds and imports
        run: |
          python -m pip install dist/*.tar.gz
          cd /tmp && python -c "import sqlparse_turbo; print(sqlparse_turbo.format('select 1', keyword_case='upper'))"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest also runs the whole package check (every corpus file, every code point) and the checks of
        # the Rust core against the front door; the others run the package check's quick cut.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # upstream: sqlparse 0.6.1's own test suite
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install the wheel
        run: |
          python -m pip install sqlparse==0.6.1 pytest
          python -m pip install --no-index --find-links dist sqlparse-turbo
          python -c "import sqlparse_turbo, sqlparse, sys, unicodedata; print(sqlparse_turbo._native.__file__, sqlparse.__version__, sys.version, 'Unicode', unicodedata.unidata_version)"
      - name: Corpus
        run: python bench/gen_corpus.py
      - name: sqlparse's test suite through the package
        run: python -X utf8 tools/run_upstream_package.py
      - name: Recursion limit
        run: python -X utf8 tools/check_recursion.py package
      - name: Django app
        run: |
          python -m pip install django
          python -X utf8 tools/check_django.py
      - name: Package against sqlparse (quick)
        if: matrix.os != 'ubuntu-latest'
        run: python -X utf8 tools/check_package.py --quick
      - name: Package against sqlparse (whole)
        if: matrix.os == 'ubuntu-latest'
        run: python -X utf8 tools/check_package.py
      - name: Rust core against the front door
        if: matrix.os == 'ubuntu-latest'
        run: |
          export PYD=$(python -c "import sqlparse_turbo._native as m; print(m.__file__)")
          python -X utf8 tools/check_tokenize.py
          python -X utf8 tools/check_tree.py quick

  other-sqlparse:
    name: With sqlparse ${{ matrix.sqlparse }} (all calls to sqlparse)
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlparse: ["0.4.4", "0.5.3", "0.6.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - run: |
          python -m pip install sqlparse==${{ matrix.sqlparse }}
          python -m pip install --no-index --find-links dist --no-deps sqlparse-turbo
          python bench/gen_corpus.py
          python -X utf8 tools/check_other_sqlparse.py
          python -m pip install django
          python -X utf8 tools/check_django.py

  publish:
    name: Upload to PyPI
    # only for a version tag, and only once every wheel passed every check
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, sdist, test, other-sqlparse]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing: no token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
